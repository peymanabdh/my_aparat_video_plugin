services:
  db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp
      MYSQL_PASSWORD: wppass
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: on-failure

  wordpress:
    image: wordpress:latest
    ports:
      - "3000:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wppass
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX}
      WORDPRESS_CONFIG_EXTRA: |
        $$_SERVER['HTTPS'] = 'on';
        define('WP_HOME', 'https://3000-' . getenv('BASE44_PUBLIC_HOST_SUFFIX'));
        define('WP_SITEURL', 'https://3000-' . getenv('BASE44_PUBLIC_HOST_SUFFIX'));
    volumes:
      - wp_data:/var/www/html
      - ./my_aparat_video_plugin.php:/var/www/html/wp-content/plugins/my-aparat-video-plugin/my_aparat_video_plugin.php
      - ./docker/disable-canonical-redirect.php:/var/www/html/wp-content/mu-plugins/disable-canonical-redirect.php
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@file_get_contents(\"http://localhost/wp-login.php\") ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: on-failure

  wp-init:
    image: wordpress:cli
    environment:
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX}
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wppass
    volumes:
      - wp_data:/var/www/html
      - ./my_aparat_video_plugin.php:/var/www/html/wp-content/plugins/my-aparat-video-plugin/my_aparat_video_plugin.php
      - ./docker/wp-init.sh:/wp-init.sh:ro
    depends_on:
      wordpress:
        condition: service_healthy
    command: ["sh", "-c", "/wp-init.sh && touch /tmp/setup-done && tail -f /dev/null"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/setup-done"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: on-failure

volumes:
  db_data:
  wp_data:
